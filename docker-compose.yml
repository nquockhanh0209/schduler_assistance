version: "3.9"

services:
  schduler-service:
    image: restream-service
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app
    command: python3 main.py
    environment:
      - BOT_TOKEN=${BOT_TOKEN}

    network_mode: "host"
    tty: true
    restart: always
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: mydatabase
   
    volumes:
      - ./db:/var/lib/mongodb
    network_mode: "host"
    tty: true
    restart: always